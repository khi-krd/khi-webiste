services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_MEDIA_HOST: ${NEXT_PUBLIC_MEDIA_HOST}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: ${API_BASE_URL}
      USE_MOCK_DATA: ${USE_MOCK_DATA:-false}
    restart: unless-stopped
